# Inter-Container Communication Optimization
# Configuration for optimal service-to-service communication

# DNS optimization for Docker networks
services:
  # Example service configuration with network optimizations
  n8n:
    networks:
      localai-network:
        aliases:
          - n8n.local
    dns:
      - 8.8.8.8
      - 1.1.1.1
    dns_search:
      - localai.local
    dns_options:
      - timeout:2
      - attempts:3

  open-webui:
    networks:
      localai-network:
        aliases:
          - openwebui.local
    dns:
      - 8.8.8.8
      - 1.1.1.1
    dns_search:
      - localai.local

  ollama:
    networks:
      ai-network:
        aliases:
          - ollama.local
      localai-network:
        aliases:
          - ollama.api.local
    dns:
      - 8.8.8.8
      - 1.1.1.1

  postgres:
    networks:
      database-network:
        aliases:
          - postgres.local
      localai-network:
        aliases:
          - db.local
    dns:
      - 8.8.8.8
      - 1.1.1.1

  redis:
    networks:
      localai-network:
        aliases:
          - redis.local
          - cache.local
    dns:
      - 8.8.8.8
      - 1.1.1.1

